services:
  # 1. PostgreSQL Database Instance
  - type: database
    name: cognitive-crm-db
    databaseName: cognitive_crm
    user: crm_user
    plan: free

  # 2. Redis Instance (for BullMQ queue coordination)
  - type: redis
    name: cognitive-crm-redis
    plan: free
    ipAllowList: [] # Strict security: only allow internal Render services

  # 3. NestJS API Backend Service
  - type: web
    name: cognitive-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: cognitive-crm-db
          property: connectionString
      - key: REDIS_HOST
        fromRedis:
          name: cognitive-crm-redis
          property: host
      - key: REDIS_PORT
        fromRedis:
          name: cognitive-crm-redis
          property: port
      - key: NODE_ENV
        value: production

  # 4. React Frontend Static Site Service
  - type: web
    name: cognitive-crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: cognitive-crm-backend
          property: host
