name: Production CI/CD Deployment

on:
  push:
    branches:
      - master
      - main

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend Integration ---
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Setup Prisma Schema & Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
        run: |
          cd backend
          npx prisma db push
          npx prisma generate

      - name: Compile NestJS Server
        run: |
          cd backend
          npm run build

      # --- Frontend Integration ---
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile and Bundle Frontend (Vite)
        run: |
          cd frontend
          npm run build

      # --- Production Deployment ---
      - name: Trigger Render Production Deploy Webhook
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_WEBHOOK_URL: ${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -X POST "$RENDER_DEPLOY_WEBHOOK_URL"
          else
            echo "RENDER_DEPLOY_WEBHOOK_URL secret is not set. Skipping live deployment trigger."
          fi
